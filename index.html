    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
    const html = new TextDecoder().decode(pt);
    try{ sessionStorage.setItem('hud_pw', pw); }catch(e){}   // unlock carries across pages this tab
    document.open(); document.write(html); document.close();
  }catch(e){ if(!stored) err.textContent = 'Wrong password.'; }
}
try{ const s = sessionStorage.getItem('hud_pw'); if(s) go(s); }catch(e){}
</script></body></html>
